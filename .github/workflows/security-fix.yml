name: Security fix (npm audit)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Usar 'npm audit fix --force' (pode incluir major versions)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: npm audit fix
        run: npm audit fix ${{ inputs.force && '--force' || '' }} || true

      - name: Testar build (gulp) — falha de verdade se der erro
        run: npx gulp styles && npx gulp scripts && npx gulp images

      - name: Ver se algo mudou
        id: changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar e enviar para branch de correção
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B security/npm-audit-fix
          git add package.json package-lock.json
          git commit -m "fix(security): npm audit fix${{ inputs.force && ' --force' || '' }}"
          git push --force origin security/npm-audit-fix
